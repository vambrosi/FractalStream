# SaddleDrop
#
#   Henon map (a fixed): H_{a,c}(x, y) = (x^2 + c - a y,  x)
#
#   Dynamical plane (parameterizes W^u(p)):
#     1) Fixed c from the parameter plane.
#     2) Color is the escape-rate potential G+
#
#   Parameter plane (c-plane):
#     1) Color is G+ evaluated at the critical point of G+ on W^u(p)
#     2) Critical point is found by using Newton's method for each c.
#
# Algorithm
#
#   For each parameter c:
#     1. find a saddle fixed point p(c) of H_{a,c};
#     2. parameterize the unstable manifold W^u(p) by z via γ;
#     3. find a critical point of the Green function G+ on W^u(p);
#     4. color c by how fast that critical point escapes to infinity;

viewers:
  - title: "Dynamical plane"
    style: complex-plane
    size: 512x512
    resizable: true
    z-coord: z
    initial-center: 0
    initial-pixel-size: 1/128
    escape-radius: escapeR
    iteration-limit: maxIters

    code: |
      # Green potential of
      #     γ(w) ~ H^n(p + (w / λ^n) v), v=(λ,1);
      #     G+   = lim (1/2^n) log|x_n|
      # See the parameter plane's copy of this function.
      define potential(w, p, lambda):
          s : C <- w / lambda ^ n
          x : C <- p + lambda * s
          y : C <- p + s

          k : Z <- 0
          while k < n:
              tmp : C <- x
              x <- x^2 + c - a y
              y <- tmp
              k <- k + 1

          m : Z <- 0
          while |x| < escapeR and m < maxIters:
              tmp2 : C <- x
              x <- x^2 + c - a y
              y <- tmp2
              m <- m + 1

          sign : Z <- if im x >= 0 then 1 else -1
          potential <- if |x| >= escapeR then sign * |m - log(log(|x|)) / log 2| else 0

      # Saddle fixed point p(c) and expanding eigenvalue λ
      b : C <- (1 + a) / 2
      disc : C <- sqrt(b^2 - c)

      # Pick the fixed point with the largest eigenvalue
      p_p : C <- b + disc
      p_m : C <- b - disc

      lambda_pp : C <- p_p + sqrt(p_p^2 - a)
      lambda_pm : C <- p_p - sqrt(p_p^2 - a)
      lambda_p_max : C <- if |lambda_pp| > |lambda_pm| then lambda_pp else lambda_pm

      lambda_mp : C <- p_m + sqrt(p_m^2 - a)
      lambda_mm : C <- p_m - sqrt(p_m^2 - a)
      lambda_m_max : C <- if |lambda_mp| > |lambda_mm| then lambda_mp else lambda_mm

      p : C <- 0
      lambda : C <- 0

      if |lambda_p_max| > |lambda_m_max|:
        p <- p_p
        lambda <- lambda_p_max

      else:
        p <- p_m
        lambda <- lambda_m_max

      # Plot G+ across the z-plane
      rate : R <- 0
      rate <- potential(z, p, lambda)

      if |rate| vanishes:
        # bounded orbit -> in K+
        color <- black

      else if imColor:
        color <- if rate > 0 then purple else green

      else:
        # escape-rate level sets of G+
        color <- rainbow(|rate|)

    tools:
        - name: Pick Critical Seed
          shortcut: c
          actions:
            - event: click-or-drag
              code: |
                erase
                draw point at z
                critSeed <- z

  - title: "Parameter plane (c)"
    style: complex-plane
    size: 512x512
    resizable: true
    z-coord: c
    initial-center: 0
    initial-pixel-size: 1/128
    escape-radius: escapeR
    iteration-limit: maxIters

    code: |
      define potential(w, p, lambda):
          s : C <- w / lambda ^ n
          x : C <- p + lambda * s
          y : C <- p + s

          # lift onto W^u(p): push the seed forward `n` times
          k : Z <- 0
          while k < n:
              tmp : C <- x
              x <- x^2 + c - a y
              y <- tmp
              k <- k + 1

          # forward-iterate and measure escape
          m : Z <- 0
          while |x| < escapeR and m < maxIters:
              tmp2 : C <- x
              x <- x^2 + c - a y
              y <- tmp2
              m <- m + 1

          # smooth Green potential (0 inside K+, > 0 outside)
          potential <- if |x| >= escapeR then log(log(|x|)) / log 2 else 0

      define actual_potential(w, p, lambda):
          s : C <- w / lambda ^ n
          x : C <- p + lambda * s
          y : C <- p + s

          # lift onto W^u(p): push the seed forward `n` times
          k : Z <- 0
          while k < n:
              tmp : C <- x
              x <- x^2 + c - a y
              y <- tmp
              k <- k + 1

          # forward-iterate and measure escape
          m : Z <- 0
          while |x| < escapeR and m < maxIters:
              tmp2 : C <- x
              x <- x^2 + c - a y
              y <- tmp2
              m <- m + 1

          # smooth Green potential (0 inside K+, > 0 outside)
          sign : Z <- if im x >= 0 then 1 else -1
          actual_potential <- if |x| >= escapeR then sign * |m - log(log(|x|)) / log 2| else 0

      # Saddle fixed point p(c)  (x = y = p,  p^2 - (1+a)p + c = 0)
      b : C <- (1 + a) / 2
      disc : C <- sqrt(b^2 - c)

      # Pick the fixed point with the largest eigenvalue
      p_p : C <- b + disc
      p_m : C <- b - disc

      lambda_pp : C <- p_p + sqrt(p_p^2 - a)
      lambda_pm : C <- p_p - sqrt(p_p^2 - a)
      lambda_p_max : C <- if |lambda_pp| > |lambda_pm| then lambda_pp else lambda_pm

      lambda_mp : C <- p_m + sqrt(p_m^2 - a)
      lambda_mm : C <- p_m - sqrt(p_m^2 - a)
      lambda_m_max : C <- if |lambda_mp| > |lambda_mm| then lambda_mp else lambda_mm

      p : C <- 0
      lambda : C <- 0

      if |lambda_p_max| > |lambda_m_max|:
        p <- p_p
        lambda <- lambda_p_max

      else:
        p <- p_m
        lambda <- lambda_m_max

      # Critical point of G+ on W^u(p) as a function of z .
      #   (Initial guess needs to be different from 0)
      z : C <- critSeed
      critical z -> potential(z, p, lambda) up to critIters times

      # Solution is the critical point. `stuck` is true if Newton failed to converge.
      # Currently, you need to initialize the variable before getting the function value.
      rate : R <- 0
      rate <- actual_potential(solution, p, lambda)

      if stuck:
        color <- white

      else if |solution| > 10^5:
        color <- grey

      else if |rate| vanishes:
        # bounded orbit -> in K+
        color <- black

      else if imColor:
        color <- if rate > 0 then purple else green

      else:
        # escape-rate level sets of G+
        color <- rainbow(|rate|)

configuration:
  title: Configuration
  size: 400x300
  vertical-contents:
    - text-entry:
        label: "a ="
        value: "0.3"
        type: C
        variable: a
    - text-entry:
        label: "c ="
        value: "0.6 + 0.2i"
        type: C
        variable: c
    - text-entry:
        label: "γ iterations:"
        value: "0"
        type: Z
        variable: "n"
    - text-entry:
        label: "Critical seed:"
        value: "0.001"
        type: C
        variable: critSeed
    - text-entry:
        label: "Critical max iterations:"
        value: "100"
        type: Z
        variable: critIters
    - text-entry:
        label: "Max iterations:"
        value: "100"
        type: Z
        variable: maxIters
    - text-entry:
        label: "Escape radius:"
        value: "10"
        type: R
        variable: escapeR
    - checkbox:
        label: "Color by imaginary part"
        value: false
        variable: imColor

