# DIAGNOSTIC: every individual feature of saddledrop-full.yaml's potential()
# has now been tested in isolation under critical, all safe:
#   - Abs in a loop's exit condition               (critical-loop-abs-debug.yaml)
#   - two sequential loops (depth-lift + escape)    (critical-two-loops-debug.yaml)
#   - R-valued target via log(|x|)/(2^n)            (critical-real-valued-debug.yaml)
# None of these alone crash, even combined (the two-loop and real-valued
# tests already stack two of the three). This file is the remaining
# candidate: an as-exact-as-possible standalone replica of potential() itself
# -- three arguments (w, p, lam), p/lam computed via sqrt *before* the
# critical call and passed in (not just referenced as free variables), and
# the exact body (tmp/tmp2 swap, `a`/c as free variables inside the loop
# body, not just the condition). Configuration variables are replaced with
# local constants (matching the real defaults: a=-0.2, depth=1, escapeR=10)
# to avoid the configuration panel as a variable; maxIters=1 matches the
# smallest setting that still crashed the real file.
#
# If this crashes: the trigger is either the 3-argument signature, or the
# sqrt-computed arguments being passed into the critical target rather than
# used as free variables, or some interaction only present in the full
# combination. If it does NOT crash, the two-viewer ensemble structure, the
# configuration panel, or the Select-tool wiring becomes the next suspect.

viewer:
  style: complex-plane
  title: "DEBUG: full potential() replica (3 args, sqrt p/lam, two loops, Abs+log)"
  size: 256x256
  resizable: true
  z-coord: c
  initial-center: 0
  initial-pixel-size: 1/64

  code: |
    a : C <- -0.2
    depth : Z <- 1
    maxIters : Z <- 1
    escapeR : R <- 10

    define potential(w, p, lam):
        s : C <- w / lam^depth
        x : C <- p + lam * s
        y : C <- p + s

        k : Z <- 0
        while k < depth:
            tmp : C <- x
            x <- x^2 + c - a * y
            y <- tmp
            k <- k + 1

        n : Z <- 0
        while |x| < escapeR and n < maxIters:
            tmp2 : C <- x
            x <- x^2 + c - a * y
            y <- tmp2
            n <- n + 1

        potential <- if |x| >= escapeR then log(|x|) / (2 ^ n) else 0

    aa  : C <- (1 + a) / 2
    p   : C <- aa + sqrt(aa^2 - c)
    lam : C <- p + sqrt(p^2 - a)

    zeta : C <- 0.1
    critical zeta -> potential(zeta, p, lam)

    color <- if stuck then white else black
