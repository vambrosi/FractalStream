# Main cardioid of the Mandelbrot set via `solve … continuing seed`, exercising
# the optional `within` / `up to … times` controls on a *continuing* solve.
#
#   alpha is a solution to  w^2 - w + c = 0.  multiplier = |f_c'(alpha)| = |2 alpha|.
#   |2 alpha| < 1  <=>  c is in the main cardioid (attracting fixed point) -> black.
#
# `w : C <- c` is the cold-start anchor (used only at the first cell of the coarse
# field; alpha ~ c for small c). `continuing seed` then carries that branch across
# the whole plane (centred, coarse, serpentine, neighbour-seeded) and refines each
# pixel from the nearest cell. The modifiers come last:
#   solve w -> F within <tol> up to <N> times continuing seed
#
# Features tested: `continuing seed`, `within <tol>`, `up to <N> times`, reading
# `solution`/`stuck`. Non-convergence -> `solution = NaN` -> handled by `if stuck`.
#
# EXPECTED:
#   Main cardioid in black, smooth blue->white exterior level sets, NO row seams.
#
# WHAT AN ERROR LOOKS LIKE:
#   - Seams / patchwork            -> continuation seeding or traversal is broken.
#   - Flat / single color          -> `solve` didn't iterate.
#   - First row correct, rest flat -> field-grid reprojection sign bug.
#   - Cardioid wrong shape         -> the equation or multiplier is off.

viewer:
  style: complex-plane
  title: "Main cardioid (continuing seed, within/up to)"
  size: 512x512
  resizable: true
  z-coord: c
  initial-center: "-0.4"
  initial-pixel-size: 1/200
  iteration-limit: maxIters
  code: |
    w : C <- c
    solve w -> w^2 - w + c within 0.0000000001 up to 60 times continuing seed
    mult : R <- |2 * solution|
    if stuck:
        color <- black
    else if mult < 1:
        color <- black
    else:
        color <- cycle(mult - 1, blue, white)

configuration:
  title: Configuration
  size: 400x120
  vertical-contents:
    - text-entry:
        label: "Max. iterations:"
        value: "100"
        type: Z
        variable: maxIters
