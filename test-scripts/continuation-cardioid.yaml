# Main cardioid of the Mandelbrot set via `continuation` of the attracting ("alpha")
# fixed point of f_c(z) = z^2 + c, using a `coordinate` anchor (`anchor: c`) and the
# optional `within` / `up to ... times` controls on `solve`.
#
#   alpha is a solution to  w^2 - w + c = 0.  multiplier = |f_c'(alpha)| = |2 alpha|.
#   |2 alpha| < 1  <=>  c is in the main cardioid (attracting fixed point) -> black.
#
# `anchor: c` seeds the very first pixel's Newton from the coordinate itself — a
# good guess since alpha ~ c for small c — and continuation then carries that
# branch across the whole plane (serpentine, neighbour-seeded).
#
# Features tested: `continuation:` block, `anchor: c`, reading `solution`/`stuck`,
# `solve ... within <tol> up to <N> times`, failure flag (`ok`) handled in the body.
#
# EXPECTED:
#   Main cardioid in black, smooth blue->white exterior level sets, NO row seams.
#
# WHAT AN ERROR LOOKS LIKE:
#   - Seams / patchwork            -> continuation seeding or traversal is broken.
#   - Flat / single color          -> `solve` didn't iterate.
#   - First row correct, rest flat -> field-grid reprojection sign bug.
#   - Cardioid wrong shape         -> the equation or multiplier is off.

viewer:
  style: complex-plane
  title: "Main cardioid via continuation (anchor: c)"
  size: 512x512
  resizable: true
  z-coord: c
  initial-center: "-0.4"
  initial-pixel-size: 1/200
  iteration-limit: maxIters

  continuation:
    unknown: w
    anchor: c
    outputs:
      - variable: mult
        type: R
        default: "0"
      - variable: ok
        type: Boolean
        default: "false"
    code: |
      solve w -> w^2 - w + c within 0.0000000001 up to 60 times
      mult <- |2 * solution|
      ok   <- not stuck

  code: |
    if not ok:
        color <- grey
    else if mult < 1:
        color <- black
    else:
        color <- cycle(mult - 1, blue, white)

configuration:
  title: Configuration
  size: 400x120
  vertical-contents:
    - text-entry:
        label: "Max. iterations:"
        value: "100"
        type: Z
        variable: maxIters
