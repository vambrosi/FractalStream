# Free variables in a user-defined function are captured at the definition site
#
#   `f(z) = z^2 + c` is defined while c = 1/4, and c is reassigned to -1 before
#   `f` is ever called. The picture shows which value the definition actually
#   captured.
#
# Expected
#   - the Julia set for c = 1/4
#
# Failure looks like
#   - the Julia set for c = -1 if the body captured `c` by reference.

viewer:
  title: Function free variable scope test
  style: complex-plane
  size: 512x512
  resizable: true
  z-coord: z
  iteration-limit: max_iters
  escape-radius: escape_radius
  initial-center: 0
  initial-pixel-size: 1/128
  code: |
      c : C <- 1/4

      define f(z):
        f <- z^2 + c

      c <- -1
      iterate z -> f(z) until z escapes
      color <- if stuck then black else rainbow(iterations / 20)

configuration:
  title: Configuration
  size: 400x200
  vertical-contents:
    - text-entry:
        label: "Max. iterations:"
        value: "100"
        type: Z
        variable: max_iters
    - text-entry:
        label: "Escape radius:"
        value: 10
        type: R
        variable: escape_radius
