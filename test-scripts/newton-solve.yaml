# Newton fractal for z^3 - 1, via the `solve` statement
#
#   `solve z -> z^3 - 1` runs Newton from each pixel's own coordinate as the
#   seed, using the symbolic derivative, and colors by the argument of the root
#   reached. The same picture as examples/newton.yaml, written without an
#   explicit loop.
#
# Exercises
#   - `solve` on a closed-form body, with the derivative taken symbolically
#   - `solution` and `stuck`
#
# Expected
#   - the Newton fractal, three-fold symmetric
#   - essentially no black pixels
#
# Failure looks like
#   - flat color or noise: `solve` never iterated, or the body or derivative is wrong
#   - all black: Newton never converges, so `stuck` is always true
#   - lost three-fold symmetry or no fractal boundary: the desugaring is off

viewer:
  style: complex-plane
  title: "Newton fractal via solve (z^3 - 1)"
  size: 512x512
  resizable: true
  z-coord: z
  initial-center: 0
  initial-pixel-size: 1/128
  iteration-limit: maxIters
  code: |
    solve z -> z^3 - 1

    if stuck:
        color <- black
    else:
        color <- rainbow(arg solution / (2 pi))

configuration:
  title: Configuration
  size: 400x120
  vertical-contents:
    - text-entry:
        label: "Max. iterations:"
        value: "100"
        type: Z
        variable: maxIters
