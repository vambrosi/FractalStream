# Smooth escape-rate picture of the Mandelbrot set
#
#   For each parameter c, iterate x <- x^2 + c from x = 0 until escape. The
#   smooth potential log|x| / 2^n approximates the Green function G+(c): zero
#   inside the set, growing outside.
#
# Exercises
#   - a multi-statement `define` with local variables and a `while` loop, called
#     in statement position
#   - `log`, integer powers, `cycle`, and configuration variables
#
# Expected
#   - the Mandelbrot set in black, surrounded by smooth blue-to-white level sets
#   - no hard integer bands and no seams
#
# Failure looks like
#   - flat or structureless: the function body or its loop never ran
#   - hard integer bands: the smooth log(|x|)/2^n term is wrong
#   - all black: the escape test never triggers

viewer:
  style: complex-plane
  title: "Mandelbrot escape rate (compound function + while loop)"
  size: 512x512
  resizable: true
  z-coord: c
  initial-center: "-0.5"
  initial-pixel-size: 1/128
  escape-radius: escapeR
  iteration-limit: maxIters
  code: |
    define greenRate(c0):
        x : C <- 0
        n : Z <- 0

        while |x| < escapeR and n < maxIters:
            x <- x^2 + c0
            n <- n + 1

        greenRate <- if |x| >= escapeR then n - log(log(|x|)) / log(2) else 0

    r : R <- 0
    r <- greenRate(c)
    color <- if r <= 0 then black else cycle(r, blue, white)

configuration:
  title: Configuration
  size: 400x160
  vertical-contents:
    - text-entry:
        label: "Max. iterations:"
        value: "100"
        type: Z
        variable: maxIters
    - text-entry:
        label: "Escape radius:"
        value: "10"
        type: R
        variable: escapeR
