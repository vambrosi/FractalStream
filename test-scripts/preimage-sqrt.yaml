# Square-root branch via `preimage`
#
#   `preimage w -> sq(w) of z` solves sq(w) = z, i.e. w^2 = z, so w = sqrt(z).
#   Seeded from w = z, Newton lands on the principal branch, so arg(solution) is
#   arg(z)/2 and the color wheel turns at half the angular speed of a plain
#   `rainbow(arg z)`.
#
# Exercises
#   - `preimage ... of <value>`
#   - an expression `define` used as the preimage target
#   - `solution` and `stuck`
#
# Expected
#   - a smooth color wheel completing one cycle per two turns of z about the
#     origin, with a single branch-cut line where the two roots meet
#
# Failure looks like
#   - a full-speed wheel, one cycle per turn: `preimage` solved the wrong equation
#   - flat or all black: Newton never converged

viewer:
  style: complex-plane
  title: "Square-root branch via preimage"
  size: 512x512
  resizable: true
  z-coord: z
  initial-center: 0
  initial-pixel-size: 1/128
  iteration-limit: maxIters
  code: |
    define sq(w):
        sq <- w^2

    w : C <- z
    preimage w -> sq(w) of z
    color <- if stuck then black else rainbow(arg solution / (2 pi))

configuration:
  title: Configuration
  size: 400x120
  vertical-contents:
    - text-entry:
        label: "Max. iterations:"
        value: "100"
        type: Z
        variable: maxIters
