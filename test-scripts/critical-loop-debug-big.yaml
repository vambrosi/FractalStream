# DIAGNOSTIC: like critical-loop-debug.yaml, but with a much larger loop trip
# count (1000 vs 3) and no `continuing seed` -- matching the mode
# saddledrop-full.yaml's parameter plane actually crashes in (unseeded
# per-pixel Newton search, likely running close to the iteration cap).
#
# critical-loop-debug.yaml's 3-iteration loop did not crash, but that was
# tested before the DoWhile stacksave/stackrestore fix (Code.hs) existed, and
# 3 iterations is small enough that even a real per-iteration leak might not
# have added up to anything measurable. This isolates the same question at
# scale: does per-call native stack use still grow with iteration count now
# that stacksave/stackrestore is supposed to bound it? A single, non-nested
# loop (aside from the nesting `critical`'s own double-dualization always
# introduces) -- if this alone crashes, the leak is real and general, not
# specific to saddledrop's two-loop `potential`. If it doesn't, the
# saddledrop crash needs something closer to its actual shape (two
# sequential loops, `log`/`sqrt`, larger code) to reproduce.

viewer:
  style: complex-plane
  title: "DEBUG: critical on a compound function with a big loop, no continuing seed"
  size: 256x256
  resizable: true
  z-coord: c
  initial-center: 0
  initial-pixel-size: 1/64

  code: |
    define f(w):
        x : C <- w
        k : Z <- 0
        while k < 10000:
            x <- x^2 + c
            k <- k + 1
        f <- x

    zeta : C <- 0.1
    critical zeta -> f(zeta)

    color <- if stuck then white else black
